<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  {{ partial "header.html" . }}

  <main class="main-content">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}

  <!-- Auth Modal -->
  <div id="auth-modal" class="modal hidden">
    <div class="modal-content">
      <button class="modal-close" onclick="closeAuthModal()">&times;</button>
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('signin')">Sign In</button>
        <button class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
      </div>

      <div id="signin-form" class="tab-content">
        <input type="email" id="signin-email" placeholder="Email" class="input-field">
        <input type="password" id="signin-password" placeholder="Password" class="input-field">
        <button onclick="signInEmail()" class="btn btn-primary">Sign In</button>
        <div class="divider">OR</div>
        <button onclick="signInGoogle()" class="btn btn-secondary">Continue with Google</button>
      </div>

      <div id="signup-form" class="tab-content hidden">
        <input type="text" id="signup-name" placeholder="Display Name" class="input-field">
        <input type="email" id="signup-email" placeholder="Email" class="input-field">
        <input type="password" id="signup-password" placeholder="Password" class="input-field">
        <button onclick="signUpEmail()" class="btn btn-primary">Sign Up</button>
        <div class="divider">OR</div>
        <button onclick="signInGoogle()" class="btn btn-secondary">Continue with Google</button>
      </div>

      <p id="auth-error" class="error-text"></p>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/reviews.js"></script>
  <script src="/js/leaderboard.js"></script>
  <script src="/js/drink.js"></script>
  <script src="/js/profile.js"></script>
  <script src="/js/upload.js"></script>
  {{ partial "firebase-init.html" . }}
</body>
</html>
