{{ define "main" }}
<div class="hero">
  <h2>RATE THE BEAST</h2>
  <p>Review every Monster Energy drink. See what others think.</p>
  <button class="btn btn-primary" onclick="window.currentUser ? window.location.href='/submit/' : openAuthModal()">
    Start Rating
  </button>
</div>

<div class="container p-4">
  <h3 style="color: var(--green); margin: 2rem 0 1rem;">🏆 Top Drinks</h3>
  <div id="top-drinks" class="grid grid-3" style="min-height: 200px;">
    <p class="text-muted">Loading...</p>
  </div>

  <h3 style="color: var(--green); margin: 3rem 0 1rem;">💬 Recent Reviews</h3>
  <div id="recent-reviews" style="display: grid; gap: 1.5rem; min-height: 200px;">
    <p class="text-muted">Loading...</p>
  </div>

  <div style="text-align: center; margin: 3rem 0;">
    <a href="/leaderboard/" class="btn btn-secondary">View Full Leaderboard</a>
  </div>
</div>

<script type="module">
  import { query, collection, where, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

  async function renderHome() {
    // Top drinks
    try {
      const q = query(
        collection(window.db, "drinks"),
        where("approved", "==", true),
        where("review_count", ">", 0),
        orderBy("avg_overall", "desc"),
        limit(3)
      );
      const snapshot = await getDocs(q);
      const drinks = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

      document.getElementById("top-drinks").innerHTML = drinks.length > 0
        ? drinks.map(drink => `
            <div class="card" onclick="window.location.href='/drink/?id=${drink.id}'">
              <div class="card-title">${drink.name}</div>
              <div style="color: var(--green); font-weight: bold; margin: 0.5rem 0;">
                ${(drink.avg_overall || 0).toFixed(1)} / 5
              </div>
              <small class="text-muted">${drink.review_count || 0} reviews</small>
            </div>
          `).join("")
        : `<p class="text-muted">No drinks rated yet.</p>`;
    } catch (error) {
      console.error("Error loading top drinks:", error);
      document.getElementById("top-drinks").innerHTML = `<p class="text-muted">Error loading drinks.</p>`;
    }

    // Recent reviews
    try {
      const q = query(
        collection(window.db, "reviews"),
        orderBy("created_at", "desc"),
        limit(6)
      );
      const snapshot = await getDocs(q);
      const reviews = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

      document.getElementById("recent-reviews").innerHTML = reviews.length > 0
        ? reviews.map(review => `
            <div class="card">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <strong>${review.user_display_name}</strong>
                <span style="color: var(--green); font-weight: bold;">${review.overall}/5</span>
              </div>
              <a href="/drink/?id=${review.drink_id}" style="color: var(--green); text-decoration: none; font-weight: 600;">
                → ${review.drink_name}
              </a>
              ${review.notes ? `<p class="text-muted" style="margin-top: 0.5rem;">${review.notes.substring(0, 100)}${review.notes.length > 100 ? '...' : ''}</p>` : ""}
            </div>
          `).join("")
        : `<p class="text-muted">No reviews yet.</p>`;
    } catch (error) {
      console.error("Error loading reviews:", error);
      document.getElementById("recent-reviews").innerHTML = `<p class="text-muted">Error loading reviews.</p>`;
    }
  }

  // Wait for Firebase to initialize
  const checkDB = setInterval(() => {
    if (window.db) {
      clearInterval(checkDB);
      renderHome();
    }
  }, 100);
</script>
{{ end }}
